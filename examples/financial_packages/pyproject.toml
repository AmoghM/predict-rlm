[project]
name = "financial-packages-rlm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "predict-rlm[examples]>=0.4.1,<0.5",
]

[tool.uv.sources]
predict-rlm = { path = "../..", editable = true }

# Records the predict-rlm API/layout version this RLM project targets.
[tool.predict-rlm.generated]
predict_rlm_version = "0.4.1"
skill_version = "2.1"
layout = "agent"
features = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["financial_rlm"]
